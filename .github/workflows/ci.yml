name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    # Hosted minutes first; ACTIONS_RUNNER_MODE=self-hosted moves the job to the pool when they run out.
    runs-on: ${{ vars.ACTIONS_RUNNER_MODE != 'self-hosted' && matrix.os || fromJSON('["self-hosted","mycelium-linux-deploy"]') }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is where the CLI broke once (spawn npx ENOENT); it stays in the matrix.
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: service/package-lock.json
      - run: npm test
